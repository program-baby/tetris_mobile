<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tetris Mobile</title>
  <style>
    :root {
      --bg1: #0a1222;
      --bg2: #101b33;
      --panel: #0f1a2f;
      --line: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --btn: #0ea5b5;
      --btn-active: #0b7c89;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: var(--text);
      background: linear-gradient(rgba(2, 6, 23, 0.62), rgba(2, 6, 23, 0.62)), url("./bg.png") center / cover no-repeat;
      display: grid;
      place-items: center;
      padding: 8px;
      overflow: hidden;
    }

    .app {
      width: min(100%, 420px);
      max-height: 100dvh;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 8px;
    }

    .panel {
      background: linear-gradient(180deg, #16233f, var(--panel));
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
    }

    .title {
      margin: 0 0 8px;
      font-size: 1rem;
      color: var(--accent);
      letter-spacing: 0.06em;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      font-size: 0.9rem;
    }

    .stats span {
      display: block;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .board-wrap {
      display: grid;
      place-items: center;
    }

    canvas {
      width: min(300px, calc((100dvh - 300px) / 2), calc(100vw - 20px));
      height: auto;
      aspect-ratio: 1 / 2;
      border: 3px solid var(--line);
      background: #020617;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    button {
      border: 0;
      border-radius: 10px;
      background: var(--btn);
      color: #ecfeff;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 10px 8px;
      touch-action: manipulation;
    }

    button:active {
      background: var(--btn-active);
      transform: translateY(1px);
    }

    .ghost {
      background: #334155;
    }

    .hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      margin: 0;
    }

    @media (max-height: 760px) {
      .hint {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1 class="title">TETRIS MOBILE</h1>
      <div class="stats">
        <div>Score<br><strong id="score">0</strong></div>
        <div>Lines<br><strong id="lines">0</strong></div>
        <div>Level<br><strong id="level">1</strong></div>
      </div>
    </section>

    <div class="board-wrap">
      <canvas id="game" width="300" height="600" aria-label="Tetris"></canvas>
    </div>

    <section class="panel actions">
      <button id="restart" class="ghost" type="button">Restart</button>
      <button id="pause" class="ghost" type="button">Pause</button>
    </section>

    <section class="panel controls">
      <button id="left" type="button">◀</button>
      <button id="rotate" type="button">⟳</button>
      <button id="right" type="button">▶</button>
      <button id="soft" type="button">▼</button>
      <button id="hard" type="button">DROP</button>
      <button id="spare" class="ghost" type="button" disabled>KEY: P</button>
    </section>

    <p class="hint">キーボードでも操作可: ← → ↓ ↑ / Space / P</p>
  </main>

  <script>
    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 30;

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    ctx.scale(BLOCK, BLOCK);

    const scoreEl = document.getElementById("score");
    const linesEl = document.getElementById("lines");
    const levelEl = document.getElementById("level");

    const restartBtn = document.getElementById("restart");
    const pauseBtn = document.getElementById("pause");
    const leftBtn = document.getElementById("left");
    const rightBtn = document.getElementById("right");
    const rotateBtn = document.getElementById("rotate");
    const softBtn = document.getElementById("soft");
    const hardBtn = document.getElementById("hard");

    const COLORS = [
      null,
      "#06b6d4",
      "#f59e0b",
      "#3b82f6",
      "#eab308",
      "#22c55e",
      "#a855f7",
      "#ef4444"
    ];

    const SHAPES = [
      [],
      [[1, 1, 1, 1]],
      [[2, 0, 0], [2, 2, 2]],
      [[0, 0, 3], [3, 3, 3]],
      [[4, 4], [4, 4]],
      [[0, 5, 5], [5, 5, 0]],
      [[0, 6, 0], [6, 6, 6]],
      [[7, 7, 0], [0, 7, 7]]
    ];

    function createBoard() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    }

    function cloneMatrix(matrix) {
      return matrix.map((row) => [...row]);
    }

    function rotate(matrix) {
      const h = matrix.length;
      const w = matrix[0].length;
      const out = Array.from({ length: w }, () => Array(h).fill(0));
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          out[x][h - 1 - y] = matrix[y][x];
        }
      }
      return out;
    }

    function collide(board, piece) {
      const { matrix, pos } = piece;
      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < matrix[y].length; x++) {
          if (!matrix[y][x]) continue;
          const ny = y + pos.y;
          const nx = x + pos.x;
          if (ny < 0 || ny >= ROWS || nx < 0 || nx >= COLS || board[ny][nx]) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(board, piece) {
      piece.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value) board[y + piece.pos.y][x + piece.pos.x] = value;
        });
      });
    }

    function clearLines(state) {
      let cleared = 0;
      outer: for (let y = ROWS - 1; y >= 0; y--) {
        for (let x = 0; x < COLS; x++) {
          if (state.board[y][x] === 0) continue outer;
        }
        state.board.splice(y, 1);
        state.board.unshift(Array(COLS).fill(0));
        cleared++;
        y++;
      }

      if (cleared > 0) {
        state.lines += cleared;
        state.score += [0, 100, 300, 500, 800][cleared] * state.level;
        state.level = Math.floor(state.lines / 10) + 1;
      }
    }

    function randomPiece() {
      const type = Math.floor(Math.random() * 7) + 1;
      const matrix = cloneMatrix(SHAPES[type]);
      return {
        matrix,
        pos: {
          x: Math.floor((COLS - matrix[0].length) / 2),
          y: 0
        }
      };
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (!value) return;
          ctx.fillStyle = COLORS[value];
          ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
          ctx.strokeStyle = "rgba(2,6,23,0.45)";
          ctx.lineWidth = 0.05;
          ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
        });
      });
    }

    function drawGrid() {
      ctx.strokeStyle = "rgba(148,163,184,0.13)";
      ctx.lineWidth = 0.03;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, ROWS);
        ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(COLS, y);
        ctx.stroke();
      }
    }

    function draw(state) {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, COLS, ROWS);
      drawGrid();
      drawMatrix(state.board, { x: 0, y: 0 });
      drawMatrix(state.piece.matrix, state.piece.pos);

      if (state.gameOver || state.paused) {
        ctx.fillStyle = "rgba(0,0,0,0.56)";
        ctx.fillRect(0, 0, COLS, ROWS);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "0.82px sans-serif";
        ctx.fillText(state.gameOver ? "GAME OVER" : "PAUSED", 2.6, 9.7);
      }
    }

    function updateHUD(state) {
      scoreEl.textContent = state.score;
      linesEl.textContent = state.lines;
      levelEl.textContent = state.level;
      pauseBtn.textContent = state.paused ? "Resume" : "Pause";
    }

    function spawnNext(state) {
      state.piece = randomPiece();
      if (collide(state.board, state.piece)) state.gameOver = true;
    }

    function drop(state) {
      if (state.gameOver || state.paused) return;
      state.piece.pos.y++;
      if (collide(state.board, state.piece)) {
        state.piece.pos.y--;
        merge(state.board, state.piece);
        clearLines(state);
        spawnNext(state);
        updateHUD(state);
      }
      state.dropCounter = 0;
    }

    function hardDrop(state) {
      if (state.gameOver || state.paused) return;
      while (!collide(state.board, state.piece)) {
        state.piece.pos.y++;
      }
      state.piece.pos.y--;
      merge(state.board, state.piece);
      clearLines(state);
      spawnNext(state);
      updateHUD(state);
      state.dropCounter = 0;
    }

    function move(state, dir) {
      if (state.gameOver || state.paused) return;
      state.piece.pos.x += dir;
      if (collide(state.board, state.piece)) state.piece.pos.x -= dir;
    }

    function rotatePiece(state) {
      if (state.gameOver || state.paused) return;
      const originalMatrix = state.piece.matrix;
      const originalX = state.piece.pos.x;
      state.piece.matrix = rotate(state.piece.matrix);

      const kicks = [0, -1, 1, -2, 2];
      for (const k of kicks) {
        state.piece.pos.x = originalX + k;
        if (!collide(state.board, state.piece)) return;
      }

      state.piece.matrix = originalMatrix;
      state.piece.pos.x = originalX;
    }

    function createState() {
      return {
        board: createBoard(),
        piece: randomPiece(),
        score: 0,
        lines: 0,
        level: 1,
        dropCounter: 0,
        lastTime: 0,
        paused: false,
        gameOver: false
      };
    }

    let state = createState();
    updateHUD(state);

    function tick(time = 0) {
      const delta = time - state.lastTime;
      state.lastTime = time;
      const speed = Math.max(1000 - (state.level - 1) * 90, 120);

      if (!state.paused && !state.gameOver) {
        state.dropCounter += delta;
        if (state.dropCounter > speed) drop(state);
      }

      draw(state);
      requestAnimationFrame(tick);
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "p" || e.key === "P") {
        state.paused = !state.paused;
        updateHUD(state);
        return;
      }
      if (state.gameOver || state.paused) return;

      if (e.key === "ArrowLeft") move(state, -1);
      else if (e.key === "ArrowRight") move(state, 1);
      else if (e.key === "ArrowDown") drop(state);
      else if (e.key === "ArrowUp") rotatePiece(state);
      else if (e.key === " ") {
        e.preventDefault();
        hardDrop(state);
      }
    });

    function bindTap(btn, fn) {
      btn.addEventListener("click", fn);
      btn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        fn();
      }, { passive: false });
    }

    bindTap(leftBtn, () => move(state, -1));
    bindTap(rightBtn, () => move(state, 1));
    bindTap(rotateBtn, () => rotatePiece(state));
    bindTap(softBtn, () => drop(state));
    bindTap(hardBtn, () => hardDrop(state));

    bindTap(restartBtn, () => {
      state = createState();
      updateHUD(state);
    });

    bindTap(pauseBtn, () => {
      state.paused = !state.paused;
      updateHUD(state);
    });

    requestAnimationFrame(tick);
  </script>
</body>
</html>
