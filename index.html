<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --grid: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22d3ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(rgba(2, 6, 23, 0.62), rgba(2, 6, 23, 0.62)), url("./bg.png") center / cover no-repeat;
      color: var(--text);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 12px;
      overflow: hidden;
    }

    .layout {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 760px;
    }

    #game {
      width: min(300px, calc((100dvh - 190px) / 2), calc(100vw - 24px));
      height: auto;
      aspect-ratio: 1 / 2;
      border: 3px solid #334155;
      background: rgba(2, 6, 23, 0.25);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }

    .next-wrap {
      margin-top: 10px;
    }

    #next {
      width: 120px;
      height: 120px;
      border: 2px solid #334155;
      background: rgba(2, 6, 23, 0.25);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
    }

    .panel {
      width: min(100%, 300px);
      background: linear-gradient(160deg, #0f172a, #111827);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.05rem;
      color: var(--accent);
    }

    .stat {
      margin: 6px 0;
      font-size: 0.95rem;
    }

    .muted {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
      margin-top: 10px;
    }

    button {
      margin-top: 8px;
      width: 100%;
      padding: 9px 12px;
      border: 0;
      border-radius: 8px;
      background: #0891b2;
      color: #ecfeff;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #0e7490;
    }

    @media (max-width: 760px) {
      body {
        padding: 8px;
      }

      .layout {
        gap: 10px;
      }

      .panel {
        padding: 10px;
      }

      h1 {
        margin-bottom: 6px;
      }

      .stat {
        margin: 4px 0;
      }
    }

    @media (max-height: 760px) {
      .muted {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <canvas id="game" width="300" height="600" aria-label="Tetris"></canvas>
    <section class="panel">
      <h1>TETRIS</h1>
      <div class="stat">Score: <span id="score">0</span></div>
      <div class="stat">Lines: <span id="lines">0</span></div>
      <div class="stat">Level: <span id="level">1</span></div>
      <div class="next-wrap">
        <div class="stat">Next</div>
        <canvas id="next" width="120" height="120" aria-label="Next piece"></canvas>
      </div>
      <button id="restart" type="button">Restart</button>
      <p class="muted">
        ← →: 移動<br>
        ↓: ソフトドロップ<br>
        ↑: 回転<br>
        Space: ハードドロップ<br>
        P: 一時停止
      </p>
    </section>
  </div>

  <script>
    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 30;
    const NEXT_GRID = 4;
    const NEXT_SIZE = 120;
    const NEXT_BLOCK = NEXT_SIZE / NEXT_GRID;

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    ctx.scale(BLOCK, BLOCK);
    const nextCanvas = document.getElementById("next");
    const nextCtx = nextCanvas.getContext("2d");
    nextCtx.scale(NEXT_BLOCK, NEXT_BLOCK);

    const scoreEl = document.getElementById("score");
    const linesEl = document.getElementById("lines");
    const levelEl = document.getElementById("level");
    const restartBtn = document.getElementById("restart");

    const COLORS = [
      null,
      "#06b6d4",
      "#f59e0b",
      "#3b82f6",
      "#eab308",
      "#22c55e",
      "#a855f7",
      "#ef4444"
    ];

    const SHAPES = [
      [],
      [[1, 1, 1, 1]],
      [[2, 0, 0], [2, 2, 2]],
      [[0, 0, 3], [3, 3, 3]],
      [[4, 4], [4, 4]],
      [[0, 5, 5], [5, 5, 0]],
      [[0, 6, 0], [6, 6, 6]],
      [[7, 7, 0], [0, 7, 7]]
    ];

    function createBoard() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    }

    function cloneMatrix(matrix) {
      return matrix.map((row) => [...row]);
    }

    function rotate(matrix) {
      const h = matrix.length;
      const w = matrix[0].length;
      const out = Array.from({ length: w }, () => Array(h).fill(0));

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          out[x][h - 1 - y] = matrix[y][x];
        }
      }
      return out;
    }

    function collide(board, piece) {
      const { matrix, pos } = piece;
      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < matrix[y].length; x++) {
          if (!matrix[y][x]) continue;
          const ny = y + pos.y;
          const nx = x + pos.x;
          if (ny < 0 || ny >= ROWS || nx < 0 || nx >= COLS || board[ny][nx]) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(board, piece) {
      piece.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value) {
            board[y + piece.pos.y][x + piece.pos.x] = value;
          }
        });
      });
    }

    function clearLines(state) {
      let cleared = 0;
      outer: for (let y = ROWS - 1; y >= 0; y--) {
        for (let x = 0; x < COLS; x++) {
          if (state.board[y][x] === 0) {
            continue outer;
          }
        }
        state.board.splice(y, 1);
        state.board.unshift(Array(COLS).fill(0));
        cleared++;
        y++;
      }

      if (cleared > 0) {
        state.lines += cleared;
        state.score += [0, 100, 300, 500, 800][cleared] * state.level;
        state.level = Math.floor(state.lines / 10) + 1;
      }
    }

    function randomPiece() {
      const type = Math.floor(Math.random() * 7) + 1;
      return {
        matrix: cloneMatrix(SHAPES[type])
      };
    }

    function createActivePiece(pieceTemplate) {
      const matrix = cloneMatrix(pieceTemplate.matrix);
      return {
        matrix,
        pos: { x: Math.floor((COLS - matrix[0].length) / 2), y: 0 }
      };
    }

    function drawMatrix(targetCtx, matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (!value) return;
          targetCtx.fillStyle = COLORS[value];
          targetCtx.fillRect(x + offset.x, y + offset.y, 1, 1);
          targetCtx.strokeStyle = "rgba(2, 6, 23, 0.4)";
          targetCtx.lineWidth = 0.05;
          targetCtx.strokeRect(x + offset.x, y + offset.y, 1, 1);
        });
      });
    }

    function drawGrid(targetCtx, cols, rows) {
      targetCtx.strokeStyle = "rgba(148, 163, 184, 0.15)";
      targetCtx.lineWidth = 0.03;
      for (let x = 0; x <= cols; x++) {
        targetCtx.beginPath();
        targetCtx.moveTo(x, 0);
        targetCtx.lineTo(x, rows);
        targetCtx.stroke();
      }
      for (let y = 0; y <= rows; y++) {
        targetCtx.beginPath();
        targetCtx.moveTo(0, y);
        targetCtx.lineTo(cols, y);
        targetCtx.stroke();
      }
    }

    function drawNext(state) {
      nextCtx.clearRect(0, 0, NEXT_GRID, NEXT_GRID);
      nextCtx.fillStyle = "#020617";
      nextCtx.fillRect(0, 0, NEXT_GRID, NEXT_GRID);
      drawGrid(nextCtx, NEXT_GRID, NEXT_GRID);

      const matrix = state.nextPiece.matrix;
      const offset = {
        x: (NEXT_GRID - matrix[0].length) / 2,
        y: (NEXT_GRID - matrix.length) / 2
      };
      drawMatrix(nextCtx, matrix, offset);
    }

    function draw(state) {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, COLS, ROWS);
      drawGrid(ctx, COLS, ROWS);
      drawMatrix(ctx, state.board, { x: 0, y: 0 });
      drawMatrix(ctx, state.piece.matrix, state.piece.pos);
      drawNext(state);

      if (state.gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(0, 0, COLS, ROWS);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "0.8px sans-serif";
        ctx.fillText("GAME OVER", 2.6, 9.5);
        ctx.font = "0.55px sans-serif";
        ctx.fillText("Restartを押してください", 1.8, 10.7);
      } else if (state.paused) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.fillRect(0, 0, COLS, ROWS);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "0.9px sans-serif";
        ctx.fillText("PAUSED", 3.2, 10);
      }
    }

    function updateHUD(state) {
      scoreEl.textContent = state.score;
      linesEl.textContent = state.lines;
      levelEl.textContent = state.level;
    }

    function spawnNext(state) {
      state.piece = createActivePiece(state.nextPiece);
      state.nextPiece = randomPiece();
      if (collide(state.board, state.piece)) {
        state.gameOver = true;
      }
    }

    function drop(state) {
      if (state.gameOver || state.paused) return;
      state.piece.pos.y++;
      if (collide(state.board, state.piece)) {
        state.piece.pos.y--;
        merge(state.board, state.piece);
        clearLines(state);
        spawnNext(state);
        updateHUD(state);
      }
      state.dropCounter = 0;
    }

    function hardDrop(state) {
      if (state.gameOver || state.paused) return;
      while (!collide(state.board, state.piece)) {
        state.piece.pos.y++;
      }
      state.piece.pos.y--;
      merge(state.board, state.piece);
      clearLines(state);
      spawnNext(state);
      updateHUD(state);
      state.dropCounter = 0;
    }

    function move(state, dir) {
      if (state.gameOver || state.paused) return;
      state.piece.pos.x += dir;
      if (collide(state.board, state.piece)) {
        state.piece.pos.x -= dir;
      }
    }

    function rotatePiece(state) {
      if (state.gameOver || state.paused) return;
      const original = state.piece.matrix;
      const rotated = rotate(state.piece.matrix);
      const originalX = state.piece.pos.x;
      state.piece.matrix = rotated;

      const kicks = [0, -1, 1, -2, 2];
      for (const kick of kicks) {
        state.piece.pos.x = originalX + kick;
        if (!collide(state.board, state.piece)) {
          return;
        }
      }

      state.piece.matrix = original;
      state.piece.pos.x = originalX;
    }

    function createState() {
      const firstPiece = randomPiece();
      const secondPiece = randomPiece();
      return {
        board: createBoard(),
        piece: createActivePiece(firstPiece),
        nextPiece: secondPiece,
        score: 0,
        lines: 0,
        level: 1,
        dropCounter: 0,
        lastTime: 0,
        paused: false,
        gameOver: false
      };
    }

    let state = createState();
    if (collide(state.board, state.piece)) {
      state.gameOver = true;
    }
    updateHUD(state);

    function tick(time = 0) {
      const delta = time - state.lastTime;
      state.lastTime = time;

      const speed = Math.max(1000 - (state.level - 1) * 90, 120);
      if (!state.paused && !state.gameOver) {
        state.dropCounter += delta;
        if (state.dropCounter > speed) {
          drop(state);
        }
      }

      draw(state);
      requestAnimationFrame(tick);
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "p" || e.key === "P") {
        state.paused = !state.paused;
        return;
      }
      if (state.gameOver || state.paused) return;

      if (e.key === "ArrowLeft") {
        move(state, -1);
      } else if (e.key === "ArrowRight") {
        move(state, 1);
      } else if (e.key === "ArrowDown") {
        drop(state);
      } else if (e.key === "ArrowUp") {
        rotatePiece(state);
      } else if (e.key === " ") {
        e.preventDefault();
        hardDrop(state);
      }
    });

    restartBtn.addEventListener("click", () => {
      state = createState();
      updateHUD(state);
    });

    requestAnimationFrame(tick);
  </script>
</body>
</html>
