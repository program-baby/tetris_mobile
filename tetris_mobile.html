<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --grid: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22d3ee;
      --control-h: 158px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(rgba(2, 6, 23, 0.62), rgba(2, 6, 23, 0.62)), url("./bg.png") center / cover no-repeat;
      color: var(--text);
      min-height: 100dvh;
      padding: 8px;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .app {
      width: 100%;
      max-width: 980px;
      min-height: calc(100dvh - 16px);
      padding: 8px;
      padding-bottom: calc(var(--control-h) + env(safe-area-inset-bottom));
    }

    .layout {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .game-center {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      width: 100%;
    }

    #game {
      width: min(300px, calc((100dvh - 220px) / 2), calc(100vw - 24px));
      height: auto;
      aspect-ratio: 1 / 2;
      border: 3px solid #334155;
      background: rgba(2, 6, 23, 0.25);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      touch-action: none;
    }

    .panel {
      width: min(260px, 100%);
      background: linear-gradient(160deg, #0f172a, #111827);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.05rem;
      color: var(--accent);
    }

    .stat {
      margin: 6px 0;
      font-size: 0.95rem;
    }

    .next-wrap {
      margin-top: 10px;
    }

    #next,
    #hold {
      width: 120px;
      height: 120px;
      border: 2px solid #334155;
      background: rgba(2, 6, 23, 0.25);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
      touch-action: manipulation;
    }

    .muted {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
      margin-top: 10px;
    }

    button,
    .ctrl-btn {
      width: 100%;
      padding: 9px 12px;
      border: 0;
      border-radius: 10px;
      background: #0891b2;
      color: #ecfeff;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    #pause {
      margin-top: 8px;
      background: #334155;
    }

    #restart {
      margin-top: 8px;
      background: #475569;
    }

    .controls-bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      padding: 8px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(2, 6, 23, 0.92), rgba(2, 6, 23, 0.72));
    }

    .controls-bottom-inner {
      width: min(620px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, minmax(56px, 1fr));
      gap: 10px;
    }

    .ctrl-btn {
      min-height: 56px;
      font-size: 1.02rem;
    }

    .ctrl-move {
      background: #0ea5e9;
    }

    .ctrl-rot {
      background: #16a34a;
    }

    .ctrl-drop {
      background: #f59e0b;
    }

    .ctrl-hard {
      background: #dc2626;
    }

    .ctrl-hold {
      background: #64748b;
    }

    #controlsLeft,
    #controlsRight {
      display: none;
    }

    .controls-side {
      width: 84px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 8px;
    }

    .controls-side .ctrl-btn {
      min-height: 56px;
      padding: 6px;
    }

    body.is-landscape .app {
      padding-bottom: 8px;
    }

    body.is-landscape .layout {
      display: grid;
      grid-template-columns: minmax(74px, 92px) minmax(0, 1fr) minmax(74px, 92px);
      align-items: stretch;
      gap: 12px;
      max-width: 980px;
      margin: 0 auto;
      height: calc(100dvh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    }

    body.is-landscape .game-center {
      align-content: center;
      align-items: center;
      justify-content: center;
      height: 100%;
      max-height: 100%;
      overflow: hidden;
      padding: 4px;
    }

    body.is-landscape #controlsLeft,
    body.is-landscape #controlsRight {
      display: flex;
      justify-content: center;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    body.is-landscape .controls-bottom {
      display: none;
    }

    body.is-landscape .panel {
      width: min(220px, 35vw);
      padding: 10px;
    }

    body.is-landscape .muted {
      display: none;
    }

    @media (max-width: 760px) {
      h1 {
        margin-bottom: 6px;
      }

      .stat {
        margin: 4px 0;
      }
    }

    @media (max-height: 430px) and (orientation: landscape) {
      .controls-side .ctrl-btn {
        min-height: 46px;
        font-size: 0.88rem;
      }

      .panel {
        font-size: 0.92rem;
      }

      #next,
      #hold {
        width: 92px;
        height: 92px;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="app">
    <div class="layout">
      <aside id="controlsLeft" class="controls-side" aria-label="Left controls">
        <button class="ctrl-btn ctrl-move" data-act="left" type="button">◀</button>
        <button class="ctrl-btn ctrl-move" data-act="right" type="button">▶</button>
        <button class="ctrl-btn ctrl-drop" data-act="soft" type="button">▼</button>
      </aside>

      <div id="gameArea" class="game-center">
        <canvas id="game" width="300" height="600" aria-label="Tetris"></canvas>
        <section class="panel">
          <h1>TETRIS</h1>
          <div class="stat">Score: <span id="score">0</span></div>
          <div class="stat">Lines: <span id="lines">0</span></div>
          <div class="stat">Level: <span id="level">1</span></div>
          <div class="stat">Combo: <span id="combo">-</span></div>
          <div class="stat">B2B: <span id="b2b">-</span></div>
          <div class="next-wrap">
            <div class="stat">Hold</div>
            <canvas id="hold" width="120" height="120" aria-label="Hold piece"></canvas>
          </div>
          <div class="next-wrap">
            <div class="stat">Next</div>
            <canvas id="next" width="120" height="120" aria-label="Next piece"></canvas>
          </div>
          <div id="status" class="stat" style="color:#67e8f9;min-height:1.2em;"></div>
          <button id="pause" type="button">Pause</button>
          <button id="restart" type="button">Restart</button>
          <p class="muted">
            ← →: 移動<br>
            ↓: ソフトドロップ<br>
            ↑: 回転<br>
            Space: ハードドロップ<br>
            C: Hold<br>
            P: 一時停止
          </p>
        </section>
      </div>

      <aside id="controlsRight" class="controls-side" aria-label="Right controls">
        <button class="ctrl-btn ctrl-rot" data-act="rotL" type="button">⟲</button>
        <button class="ctrl-btn ctrl-rot" data-act="rotR" type="button">⟳</button>
        <button class="ctrl-btn ctrl-hard" data-act="hard" type="button">DROP</button>
        <button class="ctrl-btn ctrl-hold" data-act="hold" type="button">HOLD</button>
      </aside>
    </div>
  </div>

  <div id="controlsBottom" class="controls-bottom" aria-label="Bottom controls">
    <div class="controls-bottom-inner">
      <button class="ctrl-btn ctrl-move" data-act="left" type="button">◀</button>
      <button class="ctrl-btn ctrl-move" data-act="right" type="button">▶</button>
      <button class="ctrl-btn ctrl-rot" data-act="rotL" type="button">⟲</button>
      <button class="ctrl-btn ctrl-rot" data-act="rotR" type="button">⟳</button>
      <button class="ctrl-btn ctrl-drop" data-act="soft" type="button">▼</button>
      <button class="ctrl-btn ctrl-hard" data-act="hard" type="button">DROP</button>
      <button class="ctrl-btn ctrl-hold" data-act="hold" type="button">HOLD</button>
      <button class="ctrl-btn" data-act="pause" type="button">PAUSE</button>
    </div>
  </div>

  <script>
    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 30;
    const NEXT_GRID = 4;
    const NEXT_SIZE = 120;
    const NEXT_BLOCK = NEXT_SIZE / NEXT_GRID;
    const HOLD_GRID = 4;
    const HOLD_SIZE = 120;
    const HOLD_BLOCK = HOLD_SIZE / HOLD_GRID;

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    ctx.scale(BLOCK, BLOCK);
    const nextCanvas = document.getElementById("next");
    const nextCtx = nextCanvas.getContext("2d");
    nextCtx.scale(NEXT_BLOCK, NEXT_BLOCK);
    const holdCanvas = document.getElementById("hold");
    const holdCtx = holdCanvas.getContext("2d");
    holdCtx.scale(HOLD_BLOCK, HOLD_BLOCK);

    const appEl = document.getElementById("app");
    const gameAreaEl = document.getElementById("gameArea");
    const controlsBottomEl = document.getElementById("controlsBottom");

    const scoreEl = document.getElementById("score");
    const linesEl = document.getElementById("lines");
    const levelEl = document.getElementById("level");
    const comboEl = document.getElementById("combo");
    const b2bEl = document.getElementById("b2b");
    const statusEl = document.getElementById("status");
    const pauseBtn = document.getElementById("pause");
    const restartBtn = document.getElementById("restart");

    const COLORS = [
      null,
      "#06b6d4",
      "#f59e0b",
      "#3b82f6",
      "#eab308",
      "#22c55e",
      "#a855f7",
      "#ef4444"
    ];

    const SHAPES = [
      [],
      [[1, 1, 1, 1]],
      [[2, 0, 0], [2, 2, 2]],
      [[0, 0, 3], [3, 3, 3]],
      [[4, 4], [4, 4]],
      [[0, 5, 5], [5, 5, 0]],
      [[0, 6, 0], [6, 6, 6]],
      [[7, 7, 0], [0, 7, 7]]
    ];

    function createBoard() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    }

    function cloneMatrix(matrix) {
      return matrix.map((row) => [...row]);
    }

    function rotate(matrix) {
      const h = matrix.length;
      const w = matrix[0].length;
      const out = Array.from({ length: w }, () => Array(h).fill(0));

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          out[x][h - 1 - y] = matrix[y][x];
        }
      }
      return out;
    }

    function collide(board, piece) {
      const { matrix, pos } = piece;
      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < matrix[y].length; x++) {
          if (!matrix[y][x]) continue;
          const ny = y + pos.y;
          const nx = x + pos.x;
          if (ny < 0 || ny >= ROWS || nx < 0 || nx >= COLS || board[ny][nx]) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(board, piece) {
      piece.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value) {
            board[y + piece.pos.y][x + piece.pos.x] = value;
          }
        });
      });
    }

    function findCompleteRows(board) {
      const rows = [];
      outer: for (let y = ROWS - 1; y >= 0; y--) {
        for (let x = 0; x < COLS; x++) {
          if (board[y][x] === 0) {
            continue outer;
          }
        }
        rows.push(y);
      }
      return rows;
    }

    function clearRows(board, rows) {
      rows.sort((a, b) => b - a);
      for (const y of rows) {
        board.splice(y, 1);
        board.unshift(Array(COLS).fill(0));
      }
    }

    function createBag() {
      const bag = [1, 2, 3, 4, 5, 6, 7];
      for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bag[i], bag[j]] = [bag[j], bag[i]];
      }
      return bag;
    }

    function takeFromBag(state) {
      if (state.bag.length === 0) {
        state.bag = createBag();
      }
      return { type: state.bag.pop() };
    }

    function createActivePiece(pieceTemplate) {
      const matrix = cloneMatrix(SHAPES[pieceTemplate.type]);
      return {
        type: pieceTemplate.type,
        matrix,
        pos: { x: Math.floor((COLS - matrix[0].length) / 2), y: 0 }
      };
    }

    function setStatus(state, text, duration = 900) {
      state.statusText = text;
      state.statusUntil = performance.now() + duration;
      statusEl.textContent = text;
    }

    function drawMatrix(targetCtx, matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (!value) return;
          targetCtx.fillStyle = COLORS[value];
          targetCtx.fillRect(x + offset.x, y + offset.y, 1, 1);
          targetCtx.strokeStyle = "rgba(2, 6, 23, 0.4)";
          targetCtx.lineWidth = 0.05;
          targetCtx.strokeRect(x + offset.x, y + offset.y, 1, 1);
        });
      });
    }

    function drawGrid(targetCtx, cols, rows) {
      targetCtx.strokeStyle = "rgba(148, 163, 184, 0.15)";
      targetCtx.lineWidth = 0.03;
      for (let x = 0; x <= cols; x++) {
        targetCtx.beginPath();
        targetCtx.moveTo(x, 0);
        targetCtx.lineTo(x, rows);
        targetCtx.stroke();
      }
      for (let y = 0; y <= rows; y++) {
        targetCtx.beginPath();
        targetCtx.moveTo(0, y);
        targetCtx.lineTo(cols, y);
        targetCtx.stroke();
      }
    }

    function drawNext(state) {
      nextCtx.clearRect(0, 0, NEXT_GRID, NEXT_GRID);
      nextCtx.fillStyle = "#020617";
      nextCtx.fillRect(0, 0, NEXT_GRID, NEXT_GRID);
      drawGrid(nextCtx, NEXT_GRID, NEXT_GRID);

      const matrix = SHAPES[state.nextPiece.type];
      const offset = {
        x: (NEXT_GRID - matrix[0].length) / 2,
        y: (NEXT_GRID - matrix.length) / 2
      };
      drawMatrix(nextCtx, matrix, offset);
    }

    function drawHold(state) {
      holdCtx.clearRect(0, 0, HOLD_GRID, HOLD_GRID);
      holdCtx.fillStyle = "#020617";
      holdCtx.fillRect(0, 0, HOLD_GRID, HOLD_GRID);
      drawGrid(holdCtx, HOLD_GRID, HOLD_GRID);
      if (!state.holdPiece) return;

      const matrix = SHAPES[state.holdPiece.type];
      const offset = {
        x: (HOLD_GRID - matrix[0].length) / 2,
        y: (HOLD_GRID - matrix.length) / 2
      };
      drawMatrix(holdCtx, matrix, offset);
    }

    function getGhostOffset(state) {
      const ghost = {
        matrix: state.piece.matrix,
        pos: { x: state.piece.pos.x, y: state.piece.pos.y }
      };
      if (collide(state.board, ghost)) {
        return { x: state.piece.pos.x, y: state.piece.pos.y };
      }
      while (!collide(state.board, ghost)) {
        ghost.pos.y++;
      }
      ghost.pos.y--;
      return ghost.pos;
    }

    function drawGhost(state) {
      const ghostPos = getGhostOffset(state);
      state.piece.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (!value) return;
          const gx = x + ghostPos.x;
          const gy = y + ghostPos.y;
          ctx.fillStyle = "rgba(148, 163, 184, 0.22)";
          ctx.fillRect(gx, gy, 1, 1);
          ctx.strokeStyle = "rgba(148, 163, 184, 0.42)";
          ctx.lineWidth = 0.04;
          ctx.strokeRect(gx, gy, 1, 1);
        });
      });
    }

    function draw(state) {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, COLS, ROWS);
      drawGrid(ctx, COLS, ROWS);
      drawMatrix(ctx, state.board, { x: 0, y: 0 });
      drawGhost(state);
      drawMatrix(ctx, state.piece.matrix, state.piece.pos);
      drawHold(state);
      drawNext(state);

      if (state.gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(0, 0, COLS, ROWS);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "0.8px sans-serif";
        ctx.fillText("GAME OVER", 2.6, 9.5);
        ctx.font = "0.55px sans-serif";
        ctx.fillText("Restartを押してください", 1.8, 10.7);
      } else if (state.paused) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.fillRect(0, 0, COLS, ROWS);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "0.9px sans-serif";
        ctx.fillText("PAUSED", 3.2, 10);
      }
    }

    function updateHUD(state) {
      scoreEl.textContent = state.score;
      linesEl.textContent = state.lines;
      levelEl.textContent = state.level;
      comboEl.textContent = state.combo > 0 ? `x${state.combo + 1}` : "-";
      b2bEl.textContent = state.backToBack > 1 ? `x${state.backToBack}` : "-";
      statusEl.textContent = state.statusText || "";
      pauseBtn.textContent = state.paused ? "Resume" : "Pause";
    }

    function spawnNext(state) {
      state.piece = createActivePiece(state.nextPiece);
      state.nextPiece = takeFromBag(state);
      state.holdUsed = false;
      state.lastRotate = false;
      if (collide(state.board, state.piece)) {
        state.gameOver = true;
      }
    }

    function isBlockedCell(board, x, y) {
      if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return true;
      return board[y][x] !== 0;
    }

    function isTSpin(state) {
      if (state.piece.type !== 6 || !state.lastRotate) return false;
      const cx = state.piece.pos.x + 1;
      const cy = state.piece.pos.y + 1;
      let corners = 0;
      if (isBlockedCell(state.board, cx - 1, cy - 1)) corners++;
      if (isBlockedCell(state.board, cx + 1, cy - 1)) corners++;
      if (isBlockedCell(state.board, cx - 1, cy + 1)) corners++;
      if (isBlockedCell(state.board, cx + 1, cy + 1)) corners++;
      return corners >= 3;
    }

    function scoreLock(state, cleared, tspin) {
      if (cleared > 0) {
        state.combo++;
        const base = tspin
          ? [0, 800, 1200, 1600][cleared]
          : [0, 100, 300, 500, 800][cleared];

        const b2bEligible = tspin || cleared === 4;
        let points = base * state.level;

        if (b2bEligible) {
          state.backToBack++;
          if (state.backToBack > 1) {
            points += Math.floor(base * 0.5 * state.level);
          }
        } else {
          state.backToBack = 0;
        }

        if (state.combo > 0) {
          points += state.combo * 50 * state.level;
        }

        state.lines += cleared;
        state.score += points;
        state.level = Math.floor(state.lines / 10) + 1;

        let message = "";
        if (tspin) {
          message = `T-SPIN ${cleared > 0 ? `${cleared} LINE` : ""}`.trim();
        } else if (cleared === 4) {
          message = "TETRIS!";
        } else if (cleared >= 2) {
          message = `${cleared} LINES`;
        } else if (state.combo > 0) {
          message = `COMBO x${state.combo + 1}`;
        }
        if (state.backToBack > 1 && (tspin || cleared === 4)) {
          message = `${message} B2B x${state.backToBack}`.trim();
        }
        if (message) {
          setStatus(state, message);
        }
      } else {
        state.combo = -1;
        state.backToBack = 0;
        state.lastRotate = false;
      }
    }

    function lockPiece(state) {
      merge(state.board, state.piece);
      const tspin = isTSpin(state);
      const rows = findCompleteRows(state.board);
      clearRows(state.board, rows);
      scoreLock(state, rows.length, tspin);
      spawnNext(state);
      updateHUD(state);
    }

    function drop(state) {
      if (state.gameOver || state.paused) return;
      state.lastRotate = false;
      state.piece.pos.y++;
      if (collide(state.board, state.piece)) {
        state.piece.pos.y--;
        lockPiece(state);
      }
      state.dropCounter = 0;
    }

    function hardDrop(state) {
      if (state.gameOver || state.paused) return;
      state.lastRotate = false;
      while (!collide(state.board, state.piece)) {
        state.piece.pos.y++;
      }
      state.piece.pos.y--;
      lockPiece(state);
      state.dropCounter = 0;
    }

    function move(state, dir) {
      if (state.gameOver || state.paused) return;
      state.lastRotate = false;
      state.piece.pos.x += dir;
      if (collide(state.board, state.piece)) {
        state.piece.pos.x -= dir;
      }
    }

    function rotatePiece(state, dir = 1) {
      if (state.gameOver || state.paused) return;
      const original = state.piece.matrix;
      const originalX = state.piece.pos.x;
      const turns = dir < 0 ? 3 : 1;
      let rotated = state.piece.matrix;
      for (let i = 0; i < turns; i++) {
        rotated = rotate(rotated);
      }
      state.piece.matrix = rotated;

      const kicks = [0, -1, 1, -2, 2];
      for (const kick of kicks) {
        state.piece.pos.x = originalX + kick;
        if (!collide(state.board, state.piece)) {
          state.lastRotate = true;
          return;
        }
      }

      state.piece.matrix = original;
      state.piece.pos.x = originalX;
    }

    function hold(state) {
      if (state.gameOver || state.paused || state.holdUsed) return;
      const currentTemplate = { type: state.piece.type };

      if (!state.holdPiece) {
        state.holdPiece = currentTemplate;
        spawnNext(state);
      } else {
        const swap = state.holdPiece;
        state.holdPiece = currentTemplate;
        state.piece = createActivePiece(swap);
        if (collide(state.board, state.piece)) {
          state.gameOver = true;
        }
      }

      state.holdUsed = true;
      state.lastRotate = false;
      setStatus(state, "HOLD", 600);
    }

    function createState() {
      const bag = createBag();
      const firstPiece = { type: bag.pop() };
      const secondPiece = { type: bag.pop() };
      return {
        board: createBoard(),
        piece: createActivePiece(firstPiece),
        nextPiece: secondPiece,
        holdPiece: null,
        holdUsed: false,
        bag,
        score: 0,
        lines: 0,
        level: 1,
        combo: -1,
        backToBack: 0,
        lastRotate: false,
        statusText: "",
        statusUntil: 0,
        dropCounter: 0,
        lastTime: 0,
        paused: false,
        gameOver: false
      };
    }

    let state = createState();
    if (collide(state.board, state.piece)) {
      state.gameOver = true;
    }
    updateHUD(state);

    function tick(time = 0) {
      const delta = time - state.lastTime;
      state.lastTime = time;

      const speed = Math.max(1000 - (state.level - 1) * 90, 120);
      if (!state.paused && !state.gameOver) {
        state.dropCounter += delta;
        if (state.dropCounter > speed) {
          drop(state);
        }
      }
      if (state.statusText && performance.now() > state.statusUntil) {
        state.statusText = "";
        statusEl.textContent = "";
      }

      draw(state);
      requestAnimationFrame(tick);
    }

    function setLandscapeClass() {
      const vv = window.visualViewport;
      const w = vv ? vv.width : window.innerWidth;
      const h = vv ? vv.height : window.innerHeight;
      const isLandscape = w > h;
      document.body.classList.toggle("is-landscape", isLandscape);
      fitLayout(w, h, isLandscape);
    }

    function fitLayout(vw, vh, isLandscape) {
      const bottomControlsH = controlsBottomEl.offsetHeight || 0;
      if (isLandscape) {
        appEl.style.paddingBottom = "8px";
        const maxByH = Math.floor((vh - 28) / 2);
        const maxByW = Math.floor((vw - 240) / 10);
        const nextW = Math.max(170, Math.min(320, maxByH, maxByW));
        canvas.style.width = `${nextW}px`;
      } else {
        const reserve = bottomControlsH + 10;
        appEl.style.paddingBottom = `${reserve}px`;
        const maxByH = Math.floor((vh - reserve - 36) / 2);
        const maxByW = Math.floor(vw - 32);
        const nextW = Math.max(170, Math.min(320, maxByH, maxByW));
        canvas.style.width = `${nextW}px`;
      }
      gameAreaEl.style.minHeight = "0";
    }

    let rafId = 0;
    function queueFitLayout() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(() => {
        setLandscapeClass();
        rafId = 0;
      });
    }

    function runAction(action) {
      if (action === "left") {
        move(state, -1);
      } else if (action === "right") {
        move(state, 1);
      } else if (action === "soft") {
        drop(state);
      } else if (action === "hard") {
        hardDrop(state);
      } else if (action === "rotL") {
        rotatePiece(state, -1);
      } else if (action === "rotR") {
        rotatePiece(state, 1);
      } else if (action === "hold") {
        hold(state);
      } else if (action === "pause") {
        state.paused = !state.paused;
        updateHUD(state);
      }
    }

    const holdIntervals = new Map();
    function bindControlButtons() {
      const buttons = document.querySelectorAll("[data-act]");
      const repeatable = new Set(["left", "right", "soft"]);

      buttons.forEach((button) => {
        const action = button.dataset.act;

        const start = (e) => {
          e.preventDefault();
          runAction(action);
          if (!repeatable.has(action)) return;
          const timer = setInterval(() => runAction(action), 110);
          holdIntervals.set(button, timer);
        };

        const stop = () => {
          const timer = holdIntervals.get(button);
          if (timer) {
            clearInterval(timer);
            holdIntervals.delete(button);
          }
        };

        button.addEventListener("pointerdown", start);
        button.addEventListener("pointerup", stop);
        button.addEventListener("pointerleave", stop);
        button.addEventListener("pointercancel", stop);
      });
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "p" || e.key === "P") {
        state.paused = !state.paused;
        updateHUD(state);
        return;
      }
      if (state.gameOver || state.paused) return;

      if (e.key === "ArrowLeft") {
        move(state, -1);
      } else if (e.key === "ArrowRight") {
        move(state, 1);
      } else if (e.key === "ArrowDown") {
        drop(state);
      } else if (e.key === "ArrowUp") {
        rotatePiece(state, 1);
      } else if (e.key === " ") {
        e.preventDefault();
        hardDrop(state);
      } else if (e.key === "c" || e.key === "C") {
        hold(state);
      }
    });

    pauseBtn.addEventListener("click", () => {
      state.paused = !state.paused;
      updateHUD(state);
    });

    holdCanvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      hold(state);
    });

    restartBtn.addEventListener("click", () => {
      state = createState();
      updateHUD(state);
    });

    bindControlButtons();
    queueFitLayout();
    window.addEventListener("resize", queueFitLayout);
    window.addEventListener("orientationchange", queueFitLayout);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", queueFitLayout);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
